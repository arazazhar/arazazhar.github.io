<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARAZ AZHAR</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body id="site-body">

    <nav>
        <a href="/" class="brand-glyph">
            <img src="/logo.png" alt="Araz Azhar">
        </a>
        <div class="menu-trigger" id="menu-btn">MENÜ</div>
    </nav>

    <div class="menu-overlay" id="menu-overlay">
        <a href="#hero" class="menu-link">Ana Sayfa</a>
        <a href="#hakkimda" class="menu-link">Hakkımda</a>
        <a href="#diskografi" class="menu-link">Diskografi</a>
        <a href="#gorseller" class="menu-link">Visuals</a>
        <a href="/press.html" class="menu-link">Basın Kiti</a>
        <a href="#iletisim" class="menu-link">İletişim</a>
    </div>

    <!-- Hero Section -->
    <header class="hero" id="hero">
        <div class="hero-content">
            <h1 id="h-title">araz azhar</h1>
            <p class="hero-desc" id="h-subtitle">Rap Sanatçısı & Müzik Prodüktörü</p>
            <span class="hero-label" id="h-label">RsArtMusic</span>
        </div>
    </header>

    <div class="container">
        
        <!-- About Section -->
        <section id="hakkimda">
            <h2 class="section-title">Hakkımda</h2>
            <div class="about-grid">
                <div class="about-text" id="about-content">
                    <!-- Text loaded via JS -->
                </div>
                <div>
                    <img id="about-img" class="about-image" src="" alt="Araz Azhar" style="display:none;">
                </div>
            </div>
        </section>
        
        <div class="hairline"></div>

        <!-- Discography Section (Infinite Marquee) -->
        <section id="diskografi">
    <h2 class="section-title">Diskografi</h2>
    <div class="marquee-wrapper">
                <div class="marquee-track" id="disco-marquee">
                    <!-- Loaded via JS -->
                </div>
            </div>
        </section>

        <div class="hairline"></div>

        <!-- Visuals Section (Infinite Marquee) -->
        <section id="gorseller">
    <h2 class="section-title">Visuals</h2>
    <div class="visuals-tabs">
        <button class="tab-btn active" data-target="pane-videos">Video Klipler</button>
        <button class="tab-btn" data-target="pane-photos">Fotoğraflar</button>
    </div>
            
            <div class="visuals-pane active" id="pane-videos">
                <div class="marquee-wrapper">
                    <div class="marquee-track" id="videos-marquee"></div>
                </div>
            </div>

            <div class="visuals-pane" id="pane-photos">
                <div class="marquee-wrapper">
                    <div class="marquee-track" id="photos-marquee"></div>
                </div>
            </div>
        </section>

    </div>

    <!-- Footer / Contact -->
    <footer id="iletisim">
        <h2 class="section-title" style="margin-bottom: 10px;">İletişim</h2>
        <a href="mailto:info@arazazhar.com" id="contact-email" style="color: var(--text-main); text-decoration: none; font-size: 18px; border-bottom: 1px solid var(--text-main); padding-bottom: 2px;">info@arazazhar.com</a>

        </div>
    </footer>

    <!-- Modals -->
    <div class="modal-overlay" id="track-modal">
        <button class="modal-close-icon" id="modal-close-track"></button>
        <div class="track-modal-content" id="track-modal-content">
            <div class="modal-left">
                <img id="m-cover" src="" alt="Cover">
            </div>
            <div class="modal-right">
                <h3 class="modal-title" id="m-title">Title</h3>
                <!-- Container for Single or Album Details -->
                <div id="m-track-details"></div>
                
                <div class="modal-links" style="margin-top: 20px;">
                    <a href="#" id="m-spotify" target="_blank">Spotify</a>
                    <a href="#" id="m-apple" target="_blank">Apple Music</a>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="media-modal">
        <button class="modal-close-icon" id="modal-close-media"></button>
        <button class="nav-btn prev-btn" id="media-prev">&#10094;</button>
        <div class="media-modal-content" id="media-content"></div>
        <button class="nav-btn next-btn" id="media-next">&#10095;</button>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
